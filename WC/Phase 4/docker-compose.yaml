services:
  x-server: &server
    build: .
    image: ads:lab
    command: python server.py
    cpus: 0.5
    restart: "no"            # a stopped server must stay stopped until you start it
    volumes:
      - ./:/app
      - ./script:/app/script:ro
    depends_on:
      - redis
    # `docker ps` shows (healthy) / (unhealthy) for each server: evidence for item 11.
    healthcheck:
      test: [ "CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 18812), 2).close()" ]
      interval: 3s
      timeout: 3s
      retries: 2
      start_period: 3s

  services:
    redis:
      image: redis:7-alpine
      container_name: redis

    server1:
      <<: *server
      container_name: server1
      environment: &server_env
        REDIS_HOST: redis
        SERVER_ID: server1
        DEFAULT_TEXT: sample
        SERVER_VERBOSE: ${SERVER_VERBOSE:-0}
        BYPASS_CACHE: ${BYPASS_CACHE:-0}
        ARTIFICIAL_DELAY_MS: "0"

    server2:
      <<: *server
      container_name: server2
      environment:
        <<: *server_env
        SERVER_ID: server2

    server3:
      <<: *server
      container_name: server3
      environment:
        <<: *server_env
        SERVER_ID: server3
        ARTIFICIAL_DELAY_MS: ${SLOW_DELAY_MS:-0}

    load-balancer:
      build: .
      image: ads:lab
      container_name: load-balancer
      command: python loadbalancer.py
      environment:
        LB_PORT: "18812"
        LB_ALGORITHM: ${LB_ALGORITHM:-least_connections}
        LB_VERBOSE: ${LB_VERBOSE:-0}
        HEALTH_CHECK: ${HEALTH_CHECK:-on}       # on = fault tolerance, off = Phase 3 behaviour
        HEALTH_INTERVAL: ${HEALTH_INTERVAL:-2}  # seconds between probes
        FAIL_THRESHOLD: ${FAIL_THRESHOLD:-2}    # consecutive failed probes -> unhealthy
        RISE_THRESHOLD: ${RISE_THRESHOLD:-2}    # consecutive good probes -> healthy again
        CONNECT_TIMEOUT: ${CONNECT_TIMEOUT:-1}
        BACKENDS: server1:18812,server2:18812,server3:18812
      volumes:
        - ./:/app
      depends_on:
        - server1
        - server2
        - server3

    client:
      build: .
      image: ads:lab
      container_name: client
      command: sleep infinity
      environment:
        SERVER_HOST: load-balancer
        REDIS_HOST: redis
      volumes:
        - ./:/app
      depends_on:
        - load-balancer
